name: shop

services:
  host:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=shop_platform;Username=shop;Password=${POSTGRES_PASSWORD:-change_me_locally}"
    depends_on:
      - postgres

postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop_platform
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me_locally}"
    ports:
      -"5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
