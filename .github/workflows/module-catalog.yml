name: module-catalog

on:
  push:
    branches: [main]
    paths:
      - 'src/Modules/Catalog/**'
      - 'tests/Modules/Catalog/**'
      - '.github/workflows/module-catalog.yml'
  pull_request:
    paths:
      - 'src/Modules/Catalog/**'
      - 'tests/Modules/Catalog/**'
      - '.github/workflows/module-catalog.yml'

jobs:
  ci:
    uses: ./.github/workflows/_module-ci.yml
    with:
      module: Catalog
