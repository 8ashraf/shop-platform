name: module-identity

on:
  push:
    branches: [main]
    paths:
      - 'src/Modules/Identity/**'
      - 'tests/Modules/Identity/**'
      - '.github/workflows/module-identity.yml'
  pull_request:
    paths:
      - 'src/Modules/Identity/**'
      - 'tests/Modules/Identity/**'
      - '.github/workflows/module-identity.yml'

jobs:
  ci:
    uses: ./.github/workflows/_module-ci.yml
    with:
      module: Identity
