# Reusable workflow: build and test a single module.
name: module-ci

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build module
        run: dotnet build "src/Modules/${{ inputs.module }}/Shop.Modules.${{ inputs.module }}.Infrastructure" -c Release
      - name: Unit tests
        run: dotnet test "tests/Modules/${{ inputs.module }}/Shop.Modules.${{ inputs.module }}.UnitTests" -c Release --collect:"XPlat Code Coverage"
      - name: Architecture tests (module boundaries)
        run: dotnet test "tests/Shop.ArchitectureTests" -c Release
